name: Daily GitHub Poll

on:
  schedule:
    # Every day, 10:00 UTC (6am Boston EDT, 5am EST).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll GitHub for public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_github.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily GitHub poll $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
