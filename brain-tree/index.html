<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain Tree · Amy Sterling</title>
    <meta
      name="description"
      content="Explore nervous systems across the animal tree. Meet the animals, inspect their anatomy, and trace each discovery to its evidence."
    />
    <link rel="canonical" href="https://amysterling.org/brain-tree/" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="../" class="brand"
        ><span aria-hidden="true">✣</span> Brain Tree</a
      ><button id="tree-open">Explore the tree ↗</button>
    </header>
    <main>
      <div class="trail">
        <span id="branch-label"></span><button id="fork"></button>
      </div>
      <h1 id="title">Brain Tree</h1>
      <p class="intro" id="summary"></p>
      <nav id="picker" aria-label="Select an animal"></nav>
      <section class="spread">
        <div class="plate">
          <div class="plate-head">
            <span id="latin"></span><button id="mode" hidden></button>
          </div>
          <div id="frame">
            <img id="animal" alt="" /><canvas
              id="stage"
              hidden
              aria-label="Rotatable anatomy schematic"
            ></canvas>
          </div>
          <div class="caption">
            <strong id="species"></strong><span id="stage-note"></span>
          </div>
        </div>
        <section class="observations">
          <nav id="tabs" aria-label="Specimen information"></nav>
          <div id="cards" aria-live="polite"></div>
        </section>
      </section>
      <section id="branch"></section>
      <nav id="routes" aria-label="Continue exploring"></nav>
    </main>
    <dialog id="tree">
      <div class="dialog-header">
        <h2>Explore the tree</h2>
        <button id="close" aria-label="Close tree">×</button>
      </div>
      <p>Choose a stop. Each animal represents a living branch.</p>
      <div id="tree-list"></div>
    </dialog>
    <noscript
      >Enable JavaScript to explore the specimens.
      <a href="RESEARCH_NOTES.md">Read the research notes</a>.</noscript
    >
    <script type="module" src="app.js"></script>
  </body>
</html>
